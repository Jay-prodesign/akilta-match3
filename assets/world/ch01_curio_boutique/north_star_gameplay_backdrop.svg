<g opacity=".8"><use href="#window" x="82" y="390" transform="translate(0 0) scale(.72)"/><use href="#window" x="638" y="390" transform="translate(0 0) scale(.72)"/><use href="#window" x="82" y="700" transform="translate(0 0) scale(.62)"/><use href="#window" x="638" y="700" transform="translate(0 0) scale(.62)"/></g>
