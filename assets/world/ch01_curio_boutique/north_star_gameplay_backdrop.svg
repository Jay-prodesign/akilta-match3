<path d="M18 1132L126 1120L134 1170L24 1184Z" fill="#19111c" stroke="#7f5b42" stroke-width="3"/><path d="M590 1120L702 1132L696 1184L586 1170Z" fill="#19111c" stroke="#7f5b42" stroke-width="3"/>
<path d="M35 1144L118 1135M39 1155L120 1146M602 1135L684 1144M600 1146L681 1155" stroke="#b38a58" stroke-width="2" opacity=".6"/>
