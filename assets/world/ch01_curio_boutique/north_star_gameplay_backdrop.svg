<g fill="none" stroke="#b58a58" stroke-width="2" opacity=".32">
 <path d="M70 475Q110 430 150 475Q110 520 70 475Z M110 430V520M86 452Q110 475 134 498M134 452Q110 475 86 498"/>
 <path d="M570 475Q610 430 650 475Q610 520 570 475Z M610 430V520M586 452Q610 475 634 498M634 452Q610 475 586 498"/>
 <path d="M72 830Q110 780 148 830Q110 880 72 830Z M110 780V880"/>
 <path d="M572 830Q610 780 648 830Q610 880 572 830Z M610 780V880"/>
</g>
<!-- low candlelit shelves and curios at the side edges -->
<ellipse cx="74" cy="1010" rx="110" ry="190" fill="url(#candleGlow)"/><ellipse cx="650" cy="1010" rx="110" ry="190" fill="url(#candleGlow)"/>
<path d="M20 1002H156L145 1020H30ZM564 1002H700L690 1020H575Z" fill="#17101b" stroke="url(#gold)" stroke-width="3"/>
<g transform="translate(65 972) scale(.72)"><use href="#candle"/></g><g transform="translate(653 972) scale(.72)"><use href="#candle"/></g>
<g transform="translate(115 995) scale(.62)"><use href="#rose"/></g><g transform="translate(605 995) scale(.62)"><use href="#rose"/></g>
<g transform="translate(92 1102) scale(.7)"><use href="#star"/></g><g transform="translate(628 1102) scale(.7)"><use href="#star"/></g>
