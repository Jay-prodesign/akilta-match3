name: Android Native Runtime Smoke

on:
  push:
    branches:
      - "main"
      - "feat/release-proof-*"
      - "feat/native-main-lifecycle-gate"
      - "feat/native-android-runtime-smoke"
      - "feat/native-ios-runtime-visual-evidence"
      - "feat/native-house-runtime-evidence"
      - "feat/native-secondary-runtime-proof"
      - "feat/gameplay-booster-affordance-polish"
      - "feat/gameplay-native-responsive-polish"
    paths:
      - ".github/workflows/android-runtime-smoke.yml"
      - ".github/release-proof.trigger"
      - "project.godot"
      - "export_presets.cfg"
      - "src/**"
      - "assets/**"
      - "content/**"
      - "tests/unit/test_mobile_release_contract.gd"
      - "tests/unit/test_mobile_safe_area.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android emulator toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME"             "platform-tools" "build-tools;36.0.0" "platforms;android-36"             "emulator" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Install pinned Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 20 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz" | sha256sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Android exporter and ephemeral CI signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" artifacts build/android
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -noprompt             -keystore /tmp/cat-coven-runtime-ci.keystore             -storepass changeit -keypass changeit -alias catcoven             -keyalg RSA -keysize 2048 -validity 3650             -dname "CN=Cat Coven Runtime CI,O=AKILTA,C=US"

      - name: Verify mobile configuration and Splash entry contracts
        run: |
          ./godot --headless --path . -s res://tests/unit/test_mobile_release_contract.gd
          ./godot --headless --path . -s res://tests/unit/test_mobile_safe_area.gd
          ./godot --headless --path . -s res://tests/integration/test_splash_boot_states.gd

      - name: Export x86_64 emulator APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/cat-coven-runtime-ci.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: catcoven
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: changeit
        run: |
          set -euo pipefail
          ./godot --headless --path . --export-release "Android CI Emulator APK" build/android/cat-and-coven-emulator.apk
          test -s build/android/cat-and-coven-emulator.apk
          apksigner verify --verbose --print-certs build/android/cat-and-coven-emulator.apk

      - name: Boot Pixel-class Android emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME" artifacts
          echo "no" | "$AVDMANAGER" create avd             --force             --name cat_coven_runtime             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_7"
          cat >> "$ANDROID_AVD_HOME/cat_coven_runtime.avd/config.ini" <<EOF
          hw.lcd.width=1080
          hw.lcd.height=2400
          hw.lcd.density=420
          hw.keyboard=yes
          showDeviceFrame=no
          EOF
          nohup emulator -avd cat_coven_runtime             -no-window -noaudio -no-boot-anim -no-snapshot             -gpu lavapipe -accel auto             > artifacts/emulator.log 2>&1 &
          echo $! > artifacts/emulator.pid
          timeout 180s adb wait-for-device
          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 1
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          {
            echo "MODEL=$(adb shell getprop ro.product.model | tr -d '\r')"
            echo "SDK=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            adb shell wm size
            adb shell wm density
          } | tee artifacts/device-profile.txt

      - name: Install and cold-launch Cat & Coven
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="com.akilta.catandcoven"
          adb install -r build/android/cat-and-coven-emulator.apk | tee artifacts/install.txt
          grep -Fq "Success" artifacts/install.txt
          adb logcat -c
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
          PID=""
          for i in $(seq 1 60); do
            PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
            [ -n "$PID" ] && break
            sleep 1
          done
          test -n "$PID"
          echo "COLD_PID=$PID" | tee artifacts/lifecycle.txt
          # Release builds do not reliably emit OnGodotMainLoopStarted into
          # logcat on every runner. Treat that marker as telemetry; runtime
          # acceptance is the foreground Cat & Coven process reaching a rendered
          # product frame, followed by the crash/script-log gate below.
          COLD_MAIN_LOOP_COUNT=0
          RENDERED=0
          : > artifacts/native-frame-sizes.txt
          for ATTEMPT in $(seq 1 24); do
            COLD_MAIN_LOOP_COUNT="$(adb logcat -d | grep -Fc "OnGodotMainLoopStarted" || true)"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > artifacts/cold-foreground.txt || true
            if grep -Fq "$PACKAGE" artifacts/cold-foreground.txt; then
              adb exec-out screencap -p > artifacts/android-01-cold-launch.png
              BYTES="$(stat -c%s artifacts/android-01-cold-launch.png)"
              echo "android-01-cold-launch.png attempt=$ATTEMPT bytes=$BYTES main_loop_markers=$COLD_MAIN_LOOP_COUNT" | tee -a artifacts/native-frame-sizes.txt
              if [ "$BYTES" -ge 500000 ]; then
                RENDERED=1
                break
              fi
            fi
            sleep 3
          done
          echo "COLD_MAIN_LOOP_COUNT=$COLD_MAIN_LOOP_COUNT" | tee -a artifacts/lifecycle.txt
          cat artifacts/cold-foreground.txt | tee /dev/stderr
          if [ "$RENDERED" -ne 1 ]; then
            adb logcat -d > artifacts/android-cold-render-timeout-log.txt || true
            echo "::error::Cat & Coven did not reach a rendered foreground product frame after cold launch."
            tail -200 artifacts/android-cold-render-timeout-log.txt || true
            exit 1
          fi
          test -s artifacts/android-01-cold-launch.png
          adb shell uiautomator dump /sdcard/window.xml >/dev/null || true
          adb pull /sdcard/window.xml artifacts/android-window.xml >/dev/null 2>&1 || true
          if [ -f artifacts/android-window.xml ] && grep -Fq "Viewing full screen" artifacts/android-window.xml; then
            echo "Android immersive education overlay obscured the app evidence"
            exit 1
          fi

      - name: Enter the House and capture native product UI
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="com.akilta.catandcoven"
          # 1080x2400 emulator. The Godot canvas expands vertically on this
          # device class, so avoid a single brittle physical Y coordinate.
          # Probe only points visibly inside the authored Enter CTA and stop as
          # soon as the settled product frame is no longer the ready Splash.
          sleep 3
          ENTERED=0
          COLD_BYTES="$(stat -c%s artifacts/android-01-cold-launch.png)"
          # Ambient splash motion and tactile button animation change PNG bytes
          # without changing routes. Require a material compressed-frame delta
          # before calling the frame House; the real House composition differs
          # by hundreds of KB on this fixed Pixel-class emulator.
          MIN_ROUTE_DELTA=$((COLD_BYTES / 16))
          : > artifacts/android-enter-attempts.txt
          echo "cold_bytes=$COLD_BYTES min_route_delta=$MIN_ROUTE_DELTA" | tee -a artifacts/android-enter-attempts.txt
          for TAP_Y in 2205 2255 2188 2230; do
            echo "touchscreen press x=540 y=$TAP_Y" | tee -a artifacts/android-enter-attempts.txt
            adb shell input touchscreen swipe 540 "$TAP_Y" 540 "$TAP_Y" 120
            for POLL in $(seq 1 8); do
              sleep 1
              test -n "$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
              adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > artifacts/house-foreground.txt || true
              grep -Fq "$PACKAGE" artifacts/house-foreground.txt
              PROBE="artifacts/android-enter-probe-$TAP_Y-$POLL.png"
              adb exec-out screencap -p > "$PROBE"
              test -s "$PROBE"
              PROBE_BYTES="$(stat -c%s "$PROBE")"
              DELTA=$((PROBE_BYTES - COLD_BYTES))
              if [ "$DELTA" -lt 0 ]; then DELTA=$((-DELTA)); fi
              echo "probe y=$TAP_Y poll=$POLL bytes=$PROBE_BYTES delta=$DELTA" | tee -a artifacts/android-enter-attempts.txt
              test "$PROBE_BYTES" -ge 500000
              if [ "$DELTA" -ge "$MIN_ROUTE_DELTA" ]; then
                mv "$PROBE" artifacts/android-01b-house-after-enter.png
                ENTERED=1
                echo "Material House transition observed after native touch y=$TAP_Y poll=$POLL" | tee -a artifacts/android-enter-attempts.txt
                break 2
              fi
            done
          done
          if [ "$ENTERED" -ne 1 ]; then
            cp artifacts/android-01-cold-launch.png artifacts/android-01b-house-after-enter.png
            echo "::error::Native Enter touches never produced a material post-Splash product frame."
            cat artifacts/android-enter-attempts.txt
            exit 1
          fi
          HOUSE_BYTES="$(stat -c%s artifacts/android-01b-house-after-enter.png)"
          echo "android-01b-house-after-enter.png bytes=$HOUSE_BYTES" | tee -a artifacts/native-frame-sizes.txt
          test "$HOUSE_BYTES" -ge 500000

      - name: Verify background and resume
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="com.akilta.catandcoven"
          BEFORE="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
          adb shell input keyevent KEYCODE_HOME
          sleep 3
          test -n "$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
          AFTER=""
          RENDERED=0
          for ATTEMPT in $(seq 1 16); do
            AFTER="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > artifacts/resume-foreground.txt || true
            if [ -n "$AFTER" ] && grep -Fq "$PACKAGE" artifacts/resume-foreground.txt; then
              adb exec-out screencap -p > artifacts/android-02-resumed.png
              BYTES="$(stat -c%s artifacts/android-02-resumed.png)"
              echo "android-02-resumed.png attempt=$ATTEMPT bytes=$BYTES" | tee -a artifacts/native-frame-sizes.txt
              if [ "$BYTES" -ge 500000 ]; then
                RENDERED=1
                break
              fi
            fi
            sleep 3
          done
          test -n "$AFTER"
          {
            echo "BACKGROUND_PID=$BEFORE"
            echo "RESUME_PID=$AFTER"
          } | tee -a artifacts/lifecycle.txt
          cat artifacts/resume-foreground.txt | tee /dev/stderr
          if [ "$RENDERED" -ne 1 ]; then
            adb logcat -d > artifacts/android-resume-render-timeout-log.txt || true
            echo "::error::Cat & Coven did not return to a rendered foreground product frame after resume."
            tail -200 artifacts/android-resume-render-timeout-log.txt || true
            exit 1
          fi
          test -s artifacts/android-02-resumed.png

      - name: Verify force-stop and relaunch
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="com.akilta.catandcoven"
          BEFORE="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
          adb shell am force-stop "$PACKAGE"
          sleep 2
          STOPPED="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
          test -z "$STOPPED"
          MAIN_LOOPS_BEFORE="$(adb logcat -d | grep -Fc "OnGodotMainLoopStarted" || true)"
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
          AFTER=""
          for i in $(seq 1 60); do
            AFTER="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
            [ -n "$AFTER" ] && break
            sleep 1
          done
          test -n "$AFTER"
          RELAUNCH_MAIN_LOOP_COUNT="$MAIN_LOOPS_BEFORE"
          RENDERED=0
          for ATTEMPT in $(seq 1 24); do
            RELAUNCH_MAIN_LOOP_COUNT="$(adb logcat -d | grep -Fc "OnGodotMainLoopStarted" || true)"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > artifacts/relaunch-foreground.txt || true
            if grep -Fq "$PACKAGE" artifacts/relaunch-foreground.txt; then
              adb exec-out screencap -p > artifacts/android-03-force-stop-relaunch.png
              BYTES="$(stat -c%s artifacts/android-03-force-stop-relaunch.png)"
              echo "android-03-force-stop-relaunch.png attempt=$ATTEMPT bytes=$BYTES main_loop_markers=$RELAUNCH_MAIN_LOOP_COUNT" | tee -a artifacts/native-frame-sizes.txt
              if [ "$BYTES" -ge 500000 ]; then
                RENDERED=1
                break
              fi
            fi
            sleep 3
          done
          {
            echo "FORCE_STOP_PREVIOUS_PID=$BEFORE"
            echo "RELAUNCH_PID=$AFTER"
            echo "RELAUNCH_MAIN_LOOP_COUNT=$RELAUNCH_MAIN_LOOP_COUNT"
          } | tee -a artifacts/lifecycle.txt
          cat artifacts/relaunch-foreground.txt | tee /dev/stderr
          if [ "$RENDERED" -ne 1 ]; then
            adb logcat -d > artifacts/android-relaunch-render-timeout-log.txt || true
            echo "::error::Cat & Coven did not reach a rendered foreground product frame after force-stop relaunch."
            tail -200 artifacts/android-relaunch-render-timeout-log.txt || true
            exit 1
          fi
          test -s artifacts/android-03-force-stop-relaunch.png
          test -s artifacts/android-03-force-stop-relaunch.png

      - name: Check native crash buffer
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="com.akilta.catandcoven"
          adb logcat -b crash -d > artifacts/crash-buffer.txt || true
          adb logcat -d > artifacts/logcat.txt || true

          {
            echo "NATIVE_FRAME_FINAL_BYTES"
            for frame in artifacts/android-01-cold-launch.png artifacts/android-01b-house-after-enter.png artifacts/android-02-resumed.png artifacts/android-03-force-stop-relaunch.png; do
              bytes="$(stat -c%s "$frame")"
              echo "$(basename "$frame")=$bytes"
              if [ "$bytes" -lt 500000 ]; then
                echo "Native frame is too small to constitute product-ready Cat & Coven UI: $frame ($bytes bytes)"
                exit 1
              fi
            done
          } | tee -a artifacts/native-frame-sizes.txt
          if grep -Fq "$PACKAGE" artifacts/crash-buffer.txt; then
            cat artifacts/crash-buffer.txt
            exit 1
          fi
          if grep -Eq "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:" artifacts/logcat.txt; then
            grep -E "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:" artifacts/logcat.txt
            exit 1
          fi

          # Godot Compatibility on Google SwiftShader currently has an upstream
          # fragment-uniform specialization bug. Record that emulator limitation
          # explicitly, but do not confuse it with Cat & Coven resource/script
          # failures. Any equivalent shader-link failure on a non-SwiftShader
          # renderer remains fatal.
          if grep -Eq "Program linking failed|shader failed to compile" artifacts/logcat.txt; then
            if grep -Fq "Google SwiftShader" artifacts/logcat.txt && grep -Fq "GL_MAX_FRAGMENT_UNIFORM_VECTORS" artifacts/logcat.txt; then
              {
                echo "KNOWN_ENGINE_EMULATOR_WARNING"
                echo "Godot Compatibility + Google SwiftShader uniform-vector specialization limit"
                grep -E "Program linking failed|GL_MAX_FRAGMENT_UNIFORM_VECTORS|shader failed to compile|OpenGL API" artifacts/logcat.txt | tail -80
              } > artifacts/known-swiftshader-render-warning.txt
            else
              grep -E "Program linking failed|shader failed to compile" artifacts/logcat.txt
              exit 1
            fi
          fi
          echo "VIRTUAL_DEVICE_RUNTIME_PASS: cold launch, resume, force-stop relaunch"

      - name: Capture real Gameplay through workflow-only native review route
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/cat-coven-runtime-ci.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: catcoven
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: changeit
        run: |
          set -euo pipefail
          PACKAGE="com.akilta.catandcoven"
          REVIEW_APK="build/android/cat-and-coven-gameplay-review.apk"

          # Build a second CI-only APK from the exact same product code. The
          # committed preset remains clean; only this ephemeral runner copy gets
          # the workflow-only route argument.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("export_presets.cfg")
          text = path.read_text()
          old = 'command_line/extra_args="--rendering-method gl_compatibility --rendering-driver opengl3"'
          new = 'command_line/extra_args="--rendering-method gl_compatibility --rendering-driver opengl3 --cat-coven-native-review-route=gameplay"'
          if text.count(old) != 1:
              raise SystemExit("Android CI emulator command-line contract changed")
          path.write_text(text.replace(old, new))
          PY

          ./godot --headless --path . --export-release "Android CI Emulator APK" "$REVIEW_APK"
          test -s "$REVIEW_APK"
          apksigner verify --verbose --print-certs "$REVIEW_APK"

          # Export work can occasionally make the hosted runner's adb server
          # drop its emulator transport. Re-establish the existing Pixel-class
          # device before installing the CI-only review APK.
          adb start-server || true
          DEVICE_READY=0
          for ATTEMPT in $(seq 1 30); do
            STATE="$(adb get-state 2>/dev/null | tr -d '\r' || true)"
            echo "review transport attempt=$ATTEMPT state=$STATE" | tee -a artifacts/android-gameplay-route-attempts.txt
            if [ "$STATE" = "device" ]; then
              DEVICE_READY=1
              break
            fi
            adb reconnect offline >/dev/null 2>&1 || true
            sleep 2
          done
          if [ "$DEVICE_READY" -ne 1 ]; then
            echo "::error::Android emulator transport did not recover for Gameplay review."
            adb devices -l || true
            tail -160 artifacts/emulator.log || true
            exit 1
          fi

          adb shell am force-stop "$PACKAGE"
          INSTALL_OK=0
          : > artifacts/android-gameplay-review-install.txt
          for ATTEMPT in $(seq 1 6); do
            if adb install -r "$REVIEW_APK" | tee -a artifacts/android-gameplay-review-install.txt | grep -Fq "Success"; then
              INSTALL_OK=1
              break
            fi
            adb reconnect offline >/dev/null 2>&1 || true
            sleep 3
          done
          if [ "$INSTALL_OK" -ne 1 ]; then
            echo "::error::Gameplay review APK could not be installed after transport recovery."
            cat artifacts/android-gameplay-review-install.txt
            exit 1
          fi
          adb logcat -c
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null

          PID=""
          ROUTE_SEEN=0
          RENDERED=0
          : > artifacts/android-gameplay-route-attempts.txt
          for ATTEMPT in $(seq 1 30); do
            sleep 2
            PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > artifacts/gameplay-foreground.txt || true
            adb logcat -d > artifacts/android-gameplay-route-log.txt || true
            if grep -Fq "NATIVE_RUNTIME_REVIEW_ROUTE_PASS: gameplay" artifacts/android-gameplay-route-log.txt; then
              ROUTE_SEEN=1
            fi
            if [ -n "$PID" ] && [ "$ROUTE_SEEN" -eq 1 ] && grep -Fq "$PACKAGE" artifacts/gameplay-foreground.txt; then
              # Route arrival precedes the authored Gameplay reveal tween. Wait
              # for the full composition—including the delayed booster tray—to
              # settle before accepting the native screenshot as visual proof.
              sleep 1
              adb exec-out screencap -p > artifacts/android-04-gameplay.png
              BYTES="$(stat -c%s artifacts/android-04-gameplay.png)"
              echo "android-04-gameplay.png attempt=$ATTEMPT bytes=$BYTES pid=$PID route_seen=$ROUTE_SEEN" | tee -a artifacts/android-gameplay-route-attempts.txt
              if [ "$BYTES" -ge 500000 ]; then
                RENDERED=1
                break
              fi
            else
              PID_DISPLAY="$PID"
              if [ -z "$PID_DISPLAY" ]; then PID_DISPLAY="none"; fi
              echo "attempt=$ATTEMPT pid=$PID_DISPLAY route_seen=$ROUTE_SEEN" | tee -a artifacts/android-gameplay-route-attempts.txt
            fi
          done

          test -n "$PID"
          if [ "$ROUTE_SEEN" -ne 1 ] || [ "$RENDERED" -ne 1 ]; then
            echo "::error::Cat & Coven native Android review route did not reach rendered Gameplay."
            tail -240 artifacts/android-gameplay-route-log.txt || true
            exit 1
          fi

          GAMEPLAY_BYTES="$(stat -c%s artifacts/android-04-gameplay.png)"
          echo "android-04-gameplay.png bytes=$GAMEPLAY_BYTES route=gameplay" | tee -a artifacts/native-frame-sizes.txt
          echo "ANDROID_NATIVE_GAMEPLAY_PASS: real Splash → House → Map → Prestart → Gameplay route rendered"

          if grep -Eq "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:" artifacts/android-gameplay-route-log.txt; then
            grep -E "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:" artifacts/android-gameplay-route-log.txt
            exit 1
          fi

      - name: Capture native secondary-screen journey on real product routes
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/cat-coven-runtime-ci.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: catcoven
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: changeit
        run: |
          set -euo pipefail
          PACKAGE="com.akilta.catandcoven"
          REVIEW_APK="build/android/cat-and-coven-secondary-review.apk"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("export_presets.cfg")
          text = path.read_text()
          old = 'command_line/extra_args="--rendering-method gl_compatibility --rendering-driver opengl3 --cat-coven-native-review-route=gameplay"'
          new = 'command_line/extra_args="--rendering-method gl_compatibility --rendering-driver opengl3 --cat-coven-native-review-route=secondary"'
          if text.count(old) != 1:
              raise SystemExit("Android Gameplay review command-line contract changed before secondary export")
          path.write_text(text.replace(old, new))
          PY

          ./godot --headless --path . --export-release "Android CI Emulator APK" "$REVIEW_APK"
          test -s "$REVIEW_APK"
          apksigner verify --verbose --print-certs "$REVIEW_APK"

          adb start-server || true
          DEVICE_READY=0
          for ATTEMPT in $(seq 1 30); do
            STATE="$(adb get-state 2>/dev/null | tr -d '\r' || true)"
            echo "secondary transport attempt=$ATTEMPT state=$STATE" | tee -a artifacts/android-secondary-route-attempts.txt
            if [ "$STATE" = "device" ]; then
              DEVICE_READY=1
              break
            fi
            adb reconnect offline >/dev/null 2>&1 || true
            sleep 2
          done
          if [ "$DEVICE_READY" -ne 1 ]; then
            echo "::error::Android emulator transport did not recover for secondary review."
            adb devices -l || true
            tail -160 artifacts/emulator.log || true
            exit 1
          fi

          adb shell am force-stop "$PACKAGE"
          INSTALL_OK=0
          : > artifacts/android-secondary-review-install.txt
          for ATTEMPT in $(seq 1 6); do
            if adb install -r "$REVIEW_APK" | tee -a artifacts/android-secondary-review-install.txt | grep -Fq "Success"; then
              INSTALL_OK=1
              break
            fi
            adb reconnect offline >/dev/null 2>&1 || true
            sleep 3
          done
          if [ "$INSTALL_OK" -ne 1 ]; then
            echo "::error::Secondary review APK could not be installed after transport recovery."
            cat artifacts/android-secondary-review-install.txt
            exit 1
          fi

          adb logcat -c
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
          : > artifacts/android-secondary-frame-sizes.txt

          for SPEC in "reliquary:05" "events:06" "weekly:07" "shop:08" "profile:09" "settings:10"; do
            ROUTE="${SPEC%%:*}"
            INDEX="${SPEC##*:}"
            FRAME="artifacts/android-${INDEX}-${ROUTE}.png"
            ROUTE_SEEN=0
            for ATTEMPT in $(seq 1 40); do
              sleep 0.25
              PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
              adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > artifacts/secondary-foreground.txt || true
              adb logcat -d > artifacts/android-secondary-route-log.txt || true
              ROUTE_STATE="$(grep -F "NATIVE_RUNTIME_REVIEW_ROUTE_PASS:" artifacts/android-secondary-route-log.txt | tail -1 | sed 's/.*NATIVE_RUNTIME_REVIEW_ROUTE_PASS: //' | tr -d '\r' || true)"
              echo "route=$ROUTE attempt=$ATTEMPT observed=$ROUTE_STATE pid=${PID:-none}" | tee -a artifacts/android-secondary-route-attempts.txt
              if [ -n "$PID" ] && [ "$ROUTE_STATE" = "$ROUTE" ] && grep -Fq "$PACKAGE" artifacts/secondary-foreground.txt; then
                adb exec-out screencap -p > "$FRAME"
                test -s "$FRAME"
                BYTES="$(stat -c%s "$FRAME")"
                echo "$(basename "$FRAME") bytes=$BYTES route=$ROUTE_STATE" | tee -a artifacts/android-secondary-frame-sizes.txt
                test "$BYTES" -ge 500000
                ROUTE_SEEN=1
                break
              fi
            done
            if [ "$ROUTE_SEEN" -ne 1 ]; then
              echo "::error::Cat & Coven native Android secondary journey missed rendered ${ROUTE}."
              tail -240 artifacts/android-secondary-route-log.txt || true
              exit 1
            fi
          done

          echo "ANDROID_NATIVE_SECONDARY_PASS: real Reliquary → Events → Weekly → Shop → Profile → Settings routes rendered"
          if grep -Eq "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:|FATAL EXCEPTION" artifacts/android-secondary-route-log.txt; then
            grep -E "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:|FATAL EXCEPTION" artifacts/android-secondary-route-log.txt
            exit 1
          fi

      - name: Emit compact native frames for visual inspection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for FRAME in android-01-cold-launch android-01b-house-after-enter android-02-resumed android-03-force-stop-relaunch android-04-gameplay android-05-reliquary android-06-events android-07-weekly android-08-shop android-09-profile android-10-settings; do
            SRC="artifacts/${FRAME}.png"
            [ -s "$SRC" ] || continue
            REVIEW="$SRC"
            OUT="artifacts/${FRAME}-review.jpg"
            if command -v magick >/dev/null 2>&1; then
              magick "$SRC" -resize '320x>' -quality 38 "$OUT"
              REVIEW="$OUT"
            elif command -v convert >/dev/null 2>&1; then
              convert "$SRC" -resize '320x>' -quality 38 "$OUT"
              REVIEW="$OUT"
            fi
            echo "CAT_COVEN_NATIVE_FRAME_BEGIN:${FRAME}"
            base64 -w 0 "$REVIEW"
            echo
            echo "CAT_COVEN_NATIVE_FRAME_END:${FRAME}"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-and-coven-android-runtime-evidence
          path: |
            artifacts/
            build/android/cat-and-coven-emulator.apk
            build/android/cat-and-coven-gameplay-review.apk
            build/android/cat-and-coven-secondary-review.apk
          if-no-files-found: error
