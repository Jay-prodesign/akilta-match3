name: P0 Golden Loop Render Verification

on:
  push:
    branches:
      - p0/bootstrap
      - "p1/**"
      - "feat/**"
    paths:
      - ".github/workflows/p0-visual.yml"
      - "tests/visual/capture_level1_journey.gd"
      - "tests/visual/capture_golden_feedback_vfx.gd"
      - "tests/visual/capture_splash_states.gd"
      - "tests/visual/capture_level1_failure.gd"
      - "tests/visual/capture_three_level_progression.gd"
      - "tests/visual/capture_chapter_select_states.gd"
      - "tests/visual/capture_chapter_route_frontier.gd"
      - "tests/visual/capture_level3_special.gd"
      - "tests/visual/capture_returning_player_resume.gd"
      - "src/app/**"
      - "src/ui/home/**"
      - "src/ui/splash/**"
      - "src/ui/map/**"
      - "src/ui/gameplay/**"
      - "src/ui/prestart/**"
      - "src/ui/collection/**"
      - "src/world/**"
      - "src/ui/shared/**"
      - "src/settings/**"
      - "src/ui/settings/**"
      - "src/match3/domain/**"
      - "src/match3/presentation/**"
      - "assets/pieces/**"
      - "assets/blockers/**"
      - "assets/board/**"
      - "assets/curios/**"
      - "assets/manifests/screen_asset_manifest.json"
      - "assets/world/ch01_curio_boutique/**"
  # Expensive rendered verification is milestone-based. Functional CI runs
  # continuously; this workflow is for Golden Loop render evidence only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-golden-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Render S00 boot states
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./godot --audio-driver Dummy --path . -s res://tests/visual/capture_splash_states.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|CAPTURE_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "CAPTURE_PASS: S00 boot state progression" <<<"$output"
          test -s artifacts/splash-00-loading.png
          test -s artifacts/splash-01-ready.png
          test -s artifacts/splash-02-recovered.png
          test -s artifacts/splash-03-update-required.png

      - name: Render canonical Golden Playable Loop
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./godot --audio-driver Dummy --path . -s res://tests/visual/capture_level1_journey.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|CAPTURE_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "CAPTURE_PASS: canonical Golden Playable Loop" <<<"$output"
          test -s artifacts/golden-00-splash.png
          test -s artifacts/golden-01-house-dormant.png
          test -s artifacts/golden-02-chapter-route.png
          test -s artifacts/golden-03-prestart.png
          test -s artifacts/golden-04-gameplay.png
          test -s artifacts/golden-04b-pause.png
          test -s artifacts/golden-05-win-reward.png
          test -s artifacts/golden-06-restoration.png
          test -s artifacts/golden-07-house-return.png
          test -s artifacts/golden-08-curio-verification.png
          test -s artifacts/golden-09-curio-detail.png

      - name: Render Golden Loop feedback VFX
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./godot --audio-driver Dummy --path . -s res://tests/visual/capture_golden_feedback_vfx.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|CAPTURE_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "CAPTURE_PASS: Golden Loop feedback VFX" <<<"$output"
          test -s artifacts/feedback-01-match-clear.png
          test -s artifacts/feedback-02-reward-reveal.png

      - name: Render Golden Loop failure and retry branch
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./godot --audio-driver Dummy --path . -s res://tests/visual/capture_level1_failure.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|CAPTURE_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "CAPTURE_PASS: Level 1 fail retry" <<<"$output"
          test -s artifacts/level1-fail-result.png
          test -s artifacts/level1-retry-restored.png

      - name: Render whole-product three-level review shell
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./godot --audio-driver Dummy --path . -s res://tests/visual/capture_three_level_progression.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|CAPTURE_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "CAPTURE_PASS: real three-level progression journey" <<<"$output"
          test -s artifacts/progression-house-stage1.png
          test -s artifacts/progression-house-stage2.png
          test -s artifacts/progression-house-stage3.png
          test -s artifacts/progression-level1-gameplay.png
          test -s artifacts/progression-level2-gameplay.png
          test -s artifacts/progression-level3-gameplay.png
          test -s artifacts/progression-level1-restoration.png
          test -s artifacts/progression-level2-restoration.png
          test -s artifacts/progression-level3-restoration.png
          test -s artifacts/progression-final-reliquary.png
          test -s artifacts/progression-final-reliquary-moth-detail.png
          test -s artifacts/progression-final-reliquary-thorned-detail.png
          test -s artifacts/progression-final-events.png
          test -s artifacts/progression-final-weekly-missions.png
          test -s artifacts/progression-final-shop.png
          test -s artifacts/progression-final-profile.png
          test -s artifacts/progression-final-settings.png
          test -s artifacts/progression-final-chapters.png
          test -s artifacts/progression-final-map.png

      - name: Render Level 3 special-state proof
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./godot --audio-driver Dummy --path . -s res://tests/visual/capture_level3_special.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|CAPTURE_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "CAPTURE_PASS:" <<<"$output"
          test -s artifacts/level3-line-special.png

      - name: Render returning-player resume journey
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./godot --audio-driver Dummy --path . -s res://tests/visual/capture_returning_player_resume.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|CAPTURE_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "CAPTURE_PASS: returning player resume journey" <<<"$output"
          test -s artifacts/returning-01-house-resume.png
          test -s artifacts/returning-02-map-frontier.png

      - name: Render S02 Chapters production states
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./godot --audio-driver Dummy --path . -s res://tests/visual/capture_chapter_select_states.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|CAPTURE_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "CAPTURE_PASS: S02 Chapters production states" <<<"$output"
          test -s artifacts/chapters-00-first-wing.png
          test -s artifacts/chapters-01-current-partial.png
          test -s artifacts/chapters-02-current-complete.png

      - name: Render S03 frontier progression states
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output=$(LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./godot --audio-driver Dummy --path . -s res://tests/visual/capture_chapter_route_frontier.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|CAPTURE_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "CAPTURE_PASS: S03 frontier state progression" <<<"$output"
          test -s artifacts/chapter-route-00-frontier1.png
          test -s artifacts/chapter-route-01-frontier2.png
          test -s artifacts/chapter-route-02-frontier3.png
          test -s artifacts/chapter-route-03-complete.png

      - name: Upload Golden Loop render evidence
        uses: actions/upload-artifact@v4
        with:
          name: golden-playable-loop-evidence
          path: |
            artifacts/splash-00-loading.png
            artifacts/splash-01-ready.png
            artifacts/splash-02-recovered.png
            artifacts/splash-03-update-required.png
            artifacts/feedback-01-match-clear.png
            artifacts/feedback-02-reward-reveal.png
            artifacts/golden-00-splash.png
            artifacts/golden-01-house-dormant.png
            artifacts/golden-02-chapter-route.png
            artifacts/golden-03-prestart.png
            artifacts/golden-04-gameplay.png
            artifacts/golden-04b-pause.png
            artifacts/golden-05-win-reward.png
            artifacts/golden-06-restoration.png
            artifacts/golden-07-house-return.png
            artifacts/golden-08-curio-verification.png
            artifacts/golden-09-curio-detail.png
            artifacts/level1-fail-result.png
            artifacts/level1-retry-restored.png
            artifacts/progression-house-stage1.png
            artifacts/progression-house-stage2.png
            artifacts/progression-house-stage3.png
            artifacts/progression-level1-gameplay.png
            artifacts/progression-level2-gameplay.png
            artifacts/progression-level3-gameplay.png
            artifacts/level3-line-special.png
            artifacts/returning-01-house-resume.png
            artifacts/returning-02-map-frontier.png
            artifacts/progression-map-before-level1.png
            artifacts/progression-map-before-level2.png
            artifacts/progression-map-before-level3.png
            artifacts/progression-level1-result.png
            artifacts/progression-level2-result.png
            artifacts/progression-level3-result.png
            artifacts/progression-level1-restoration.png
            artifacts/progression-level2-restoration.png
            artifacts/progression-level3-restoration.png
            artifacts/progression-final-reliquary.png
            artifacts/progression-final-reliquary-moth-detail.png
            artifacts/progression-final-reliquary-thorned-detail.png
            artifacts/progression-final-events.png
            artifacts/progression-final-weekly-missions.png
            artifacts/progression-final-shop.png
            artifacts/progression-final-profile.png
            artifacts/progression-final-settings.png
            artifacts/progression-final-chapters.png
            artifacts/chapters-00-first-wing.png
            artifacts/chapters-01-current-partial.png
            artifacts/chapters-02-current-complete.png
            artifacts/chapter-route-00-frontier1.png
            artifacts/chapter-route-01-frontier2.png
