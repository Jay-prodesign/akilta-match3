name: Materialize Wax Seal pass

on:
  push:
    branches:
      - p0/bootstrap
    paths:
      - ".github/workflows/materialize-wax-seals.yml"
      - "assets/staging/wax_seal_pass_final.zip"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Wax Seal raster states
        shell: bash
        run: |
          set -euo pipefail
          unzip -o assets/staging/wax_seal_pass_final.zip -d assets/blockers
          test -s assets/blockers/ch01_blocker_wax_seal_intact_v01.webp
          test -s assets/blockers/ch01_blocker_wax_seal_cracked_v01.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/blockers/*.webp
          git rm -f assets/staging/wax_seal_pass_final.zip .github/workflows/materialize-wax-seals.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install Wax Seal raster states"
          git push origin HEAD:p0/bootstrap