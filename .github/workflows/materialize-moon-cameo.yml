name: Materialize Moon Cameo pass

on:
  push:
    branches:
      - p0/bootstrap
    paths:
      - ".github/workflows/materialize-moon-cameo.yml"
      - "assets/staging/moon_cameo_pass_final2.zip"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Moon Cameo raster states
        shell: bash
        run: |
          set -euo pipefail
          unzip -o assets/staging/moon_cameo_pass_final2.zip -d assets/curios
          test -s assets/curios/ch01_curio_moon_cameo_sealed_v01.webp
          test -s assets/curios/ch01_curio_moon_cameo_awakened_v01.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/curios/*.webp
          git rm -f assets/staging/moon_cameo_pass_final2.zip .github/workflows/materialize-moon-cameo.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install Moon Cameo raster states"
          git push origin HEAD:p0/bootstrap