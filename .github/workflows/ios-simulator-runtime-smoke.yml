name: iOS Native Simulator Runtime Smoke

on:
  push:
    branches:
      - "main"
      - "feat/ios-simulator-runtime-smoke"
    paths:
      - ".github/workflows/ios-simulator-runtime-smoke.yml"
      - ".github/release-proof.trigger"
      - "project.godot"
      - "export_presets.cfg"
      - "src/**"
      - "assets/**"
      - "content/**"
      - "tests/unit/test_mobile_release_contract.gd"
      - "tests/unit/test_mobile_safe_area.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 20 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"
          echo "c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  godot.zip" | shasum -a 256 -c -
          unzip -q godot.zip
          GODOT="./Godot.app/Contents/MacOS/Godot"
          "$GODOT" --version
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz" | shasum -a 256 -c -
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable" /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Verify native mobile contracts
        shell: bash
        run: |
          set -euo pipefail
          ./Godot.app/Contents/MacOS/Godot --headless --path . -s res://tests/unit/test_mobile_release_contract.gd
          ./Godot.app/Contents/MacOS/Godot --headless --path . -s res://tests/unit/test_mobile_safe_area.gd

      - name: Export iOS Xcode project with simulator library
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' 's/__IOS_TEAM_ID__/CIABCDE12X/g' export_presets.cfg
          mkdir -p build/ios artifacts
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS Xcode Project" build/ios/CatAndCoven.zip
          test -f build/ios/CatAndCoven.xcodeproj/project.pbxproj
          test -d build/ios/CatAndCoven.xcframework/ios-arm64_x86_64-simulator

      - name: Compile unsigned iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/ios/CatAndCoven.xcodeproj \
            -scheme CatAndCoven \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            ARCHS=x86_64 \
            EXCLUDED_ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee artifacts/xcodebuild-simulator.txt
          APP_PATH="$(find build/ios-derived/Build/Products -type d -name 'CatAndCoven.app' | head -1)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/CatAndCoven"
          echo "IOS_SIM_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Select and boot available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > artifacts/simulator-devices.json
          python3 - <<'PY' > artifacts/simulator-choice.env
          import json, re
          data = json.load(open("artifacts/simulator-devices.json"))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              nums = tuple(int(x) for x in re.findall(r"\d+", runtime))
              for device in devices:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      candidates.append((nums, device["name"], device["udid"], runtime))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          nums, name, udid, runtime = sorted(candidates, reverse=True)[0]
          print(f"SIM_UDID={udid}")
          print(f"SIM_NAME={name}")
          print(f"SIM_RUNTIME={runtime}")
          PY
          cat artifacts/simulator-choice.env
          cat artifacts/simulator-choice.env >> "$GITHUB_ENV"
          SIM_UDID="$(grep '^SIM_UDID=' artifacts/simulator-choice.env | cut -d= -f2-)"
          test -n "$SIM_UDID"
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Install and cold-launch Cat & Coven on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="com.akilta.catandcoven"
          xcrun simctl install "$SIM_UDID" "$IOS_SIM_APP_PATH"
          xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" app | tee artifacts/ios-installed-app-container.txt
          LAUNCH_OUTPUT="$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" 2>&1)"
          printf '%s\n' "$LAUNCH_OUTPUT" | tee artifacts/ios-cold-launch.txt
          APP_PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' | tail -1)"
          test -n "$APP_PID"
          echo "IOS_COLD_PID=$APP_PID" | tee artifacts/ios-lifecycle.txt
          sleep 8
          xcrun simctl spawn "$SIM_UDID" launchctl list > artifacts/ios-launchctl-list.txt 2>&1 || true
          if ! grep -Fq "$BUNDLE_ID" artifacts/ios-launchctl-list.txt; then
            xcrun simctl spawn "$SIM_UDID" log show --last 1m --style compact --predicate 'process == "CatAndCoven"' > artifacts/ios-cold-launch-runtime-log.txt || true
            echo "::error::Cat & Coven is not registered as a live simulator service after cold launch."
            tail -200 artifacts/ios-cold-launch-runtime-log.txt || true
            exit 1
          fi
          grep -F "$BUNDLE_ID" artifacts/ios-launchctl-list.txt | tee artifacts/ios-process-alive.txt
          xcrun simctl io "$SIM_UDID" screenshot artifacts/ios-01-cold-launch.png
          test -s artifacts/ios-01-cold-launch.png
          BYTES="$(stat -f%z artifacts/ios-01-cold-launch.png)"
          echo "ios-01-cold-launch.png=$BYTES" | tee artifacts/ios-frame-sizes.txt
          test "$BYTES" -ge 200000

      - name: Verify terminate and relaunch
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="com.akilta.catandcoven"
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID"
          sleep 2
          LAUNCH_OUTPUT="$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" 2>&1)"
          printf '%s\n' "$LAUNCH_OUTPUT" | tee artifacts/ios-relaunch.txt
          APP_PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' | tail -1)"
          test -n "$APP_PID"
          echo "IOS_RELAUNCH_PID=$APP_PID" | tee -a artifacts/ios-lifecycle.txt
          sleep 5
          xcrun simctl spawn "$SIM_UDID" launchctl list > artifacts/ios-relaunch-launchctl-list.txt 2>&1 || true
          grep -F "$BUNDLE_ID" artifacts/ios-relaunch-launchctl-list.txt | tee artifacts/ios-process-relaunch-alive.txt
          xcrun simctl io "$SIM_UDID" screenshot artifacts/ios-02-relaunch.png
          test -s artifacts/ios-02-relaunch.png
          BYTES="$(stat -f%z artifacts/ios-02-relaunch.png)"
          echo "ios-02-relaunch.png=$BYTES" | tee -a artifacts/ios-frame-sizes.txt
          test "$BYTES" -ge 200000

      - name: Check iOS runtime log for Cat & Coven failures
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl spawn "$SIM_UDID" log show --last 4m --style compact --predicate 'process == "CatAndCoven"' > artifacts/ios-runtime-log.txt || true
          if grep -Eq "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:|Terminating app due to uncaught exception|EXC_CRASH|SIGABRT" artifacts/ios-runtime-log.txt; then
            grep -E "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:|Terminating app due to uncaught exception|EXC_CRASH|SIGABRT" artifacts/ios-runtime-log.txt
            exit 1
          fi
          echo "IOS_SIMULATOR_RUNTIME_PASS: build, install, cold launch, terminate, relaunch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-and-coven-ios-simulator-runtime-evidence
          path: |
            artifacts/
          if-no-files-found: error
