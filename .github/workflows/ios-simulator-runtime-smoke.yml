name: iOS Native Simulator Runtime Smoke

on:
  push:
    branches:
      - "main"
      - "feat/ios-simulator-runtime-smoke"
      - "feat/ios-simulator-render-readiness"
      - "feat/native-ios-runtime-visual-evidence"
      - "feat/native-house-runtime-evidence"
      - "feat/ios-simulator-runtime-relaunch-proof"
      - "feat/native-secondary-runtime-proof"
      - "feat/gameplay-booster-affordance-polish"
      - "feat/gameplay-native-responsive-polish"
    paths:
      - ".github/workflows/ios-simulator-runtime-smoke.yml"
      - ".github/release-proof.trigger"
      - "project.godot"
      - "export_presets.cfg"
      - "src/**"
      - "assets/**"
      - "content/**"
      - "tests/unit/test_mobile_release_contract.gd"
      - "tests/unit/test_mobile_safe_area.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 20 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"
          echo "c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  godot.zip" | shasum -a 256 -c -
          unzip -q godot.zip
          GODOT="./Godot.app/Contents/MacOS/Godot"
          "$GODOT" --version
          curl -L --fail --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 20 -o templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz" | shasum -a 256 -c -
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable" /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"

      - name: Verify native mobile and Splash entry contracts
        shell: bash
        run: |
          set -euo pipefail
          ./Godot.app/Contents/MacOS/Godot --headless --path . -s res://tests/unit/test_mobile_release_contract.gd
          ./Godot.app/Contents/MacOS/Godot --headless --path . -s res://tests/unit/test_mobile_safe_area.gd
          ./Godot.app/Contents/MacOS/Godot --headless --path . -s res://tests/integration/test_splash_boot_states.gd

      - name: Export iOS Xcode project with simulator library
        shell: bash
        run: |
          set -euo pipefail
          sed -i '' 's/__IOS_TEAM_ID__/CIABCDE12X/g' export_presets.cfg
          mkdir -p build/ios artifacts
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS Xcode Project" build/ios/CatAndCoven.zip
          test -f build/ios/CatAndCoven.xcodeproj/project.pbxproj
          test -d build/ios/CatAndCoven.xcframework/ios-arm64_x86_64-simulator

      - name: Compile unsigned iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/ios/CatAndCoven.xcodeproj \
            -scheme CatAndCoven \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            ARCHS=x86_64 \
            EXCLUDED_ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee artifacts/xcodebuild-simulator.txt
          APP_PATH="$(find build/ios-derived/Build/Products -type d -name 'CatAndCoven.app' | head -1)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/CatAndCoven"
          echo "IOS_SIM_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Select and boot SDK-matched iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > artifacts/simulator-devices.json
          xcrun --sdk iphonesimulator --show-sdk-version | tee artifacts/ios-simulator-sdk-version.txt
          python3 - <<'PY' > artifacts/simulator-choice.env
          import json, re, subprocess
          data = json.load(open("artifacts/simulator-devices.json"))
          sdk_version = subprocess.check_output(
              ["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"],
              text=True,
          ).strip()
          sdk_nums = tuple(int(x) for x in re.findall(r"\d+", sdk_version)[:2])
          preferred_names = {
              "iPhone SE (3rd generation)": 0,
              "iPhone 16e": 1,
              "iPhone 16": 2,
              "iPhone 16 Pro": 3,
          }
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              nums = tuple(int(x) for x in re.findall(r"\d+", runtime)[:2])
              for device in devices:
                  name = str(device.get("name", ""))
                  if device.get("isAvailable") and name.startswith("iPhone"):
                      candidates.append((nums, preferred_names.get(name, 99), name, device["udid"], runtime))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          exact = [c for c in candidates if c[0] == sdk_nums]
          pool = exact if exact else [c for c in candidates if c[0] <= sdk_nums]
          if not pool:
              pool = candidates
          nums, _, name, udid, runtime = sorted(pool, key=lambda c: (-c[0][0], -c[0][1], c[1], c[2]))[0]
          print(f"SIM_UDID={udid}")
          print(f"SIM_NAME={name}")
          print(f"SIM_RUNTIME={runtime}")
          print(f"SIM_SDK_VERSION={sdk_version}")
          PY
          cat artifacts/simulator-choice.env
          cat artifacts/simulator-choice.env >> "$GITHUB_ENV"
          SIM_UDID="$(grep '^SIM_UDID=' artifacts/simulator-choice.env | cut -d= -f2-)"
          test -n "$SIM_UDID"
          export SIM_UDID

          # Reusing the newest installed runtime caused multi-minute migration stalls
          # on hosted runners even though the app was built with an older active SDK.
          # Start from a clean simulator that matches the active iphonesimulator SDK.
          xcrun simctl shutdown "$SIM_UDID" >/dev/null 2>&1 || true
          xcrun simctl erase "$SIM_UDID" >/dev/null 2>&1 || true
          xcrun simctl boot "$SIM_UDID"
          if ! python3 - <<'PY'
          import os, subprocess, sys
          udid = os.environ["SIM_UDID"]
          try:
              subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=True, timeout=300)
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as exc:
              print(f"SDK-matched simulator boot readiness failed: {exc}", file=sys.stderr)
              raise SystemExit(1)
          PY
          then
            echo "::error::SDK-matched simulator failed to become ready."
            xcrun simctl list devices | tee artifacts/simulator-devices-after-failure.txt
            exit 1
          fi

      - name: Install and cold-launch Cat & Coven on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="com.akilta.catandcoven"
          xcrun simctl install "$SIM_UDID" "$IOS_SIM_APP_PATH"
          xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" app | tee artifacts/ios-installed-app-container.txt
          LAUNCH_OUTPUT="$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" 2>&1)"
          printf '%s\n' "$LAUNCH_OUTPUT" | tee artifacts/ios-cold-launch.txt
          APP_PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' | tail -1)"
          test -n "$APP_PID"
          echo "IOS_COLD_PID=$APP_PID" | tee artifacts/ios-lifecycle.txt
          sleep 8
          xcrun simctl spawn "$SIM_UDID" launchctl list > artifacts/ios-launchctl-list.txt 2>&1 || true
          if ! grep -Fq "$BUNDLE_ID" artifacts/ios-launchctl-list.txt; then
            xcrun simctl spawn "$SIM_UDID" log show --last 1m --style compact --predicate 'process == "CatAndCoven"' > artifacts/ios-cold-launch-runtime-log.txt || true
            echo "::error::Cat & Coven is not registered as a live simulator service after cold launch."
            tail -200 artifacts/ios-cold-launch-runtime-log.txt || true
            exit 1
          fi
          grep -F "$BUNDLE_ID" artifacts/ios-launchctl-list.txt | tee artifacts/ios-process-alive.txt
          RENDERED=0
          : > artifacts/ios-frame-sizes.txt
          for ATTEMPT in $(seq 1 12); do
            xcrun simctl io "$SIM_UDID" screenshot artifacts/ios-01-cold-launch.png
            test -s artifacts/ios-01-cold-launch.png
            BYTES="$(stat -f%z artifacts/ios-01-cold-launch.png)"
            echo "ios-01-cold-launch.png attempt=$ATTEMPT bytes=$BYTES" | tee -a artifacts/ios-frame-sizes.txt
            if [ "$BYTES" -ge 200000 ]; then
              RENDERED=1
              break
            fi
            sleep 5
          done
          if [ "$RENDERED" -ne 1 ]; then
            xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact --predicate 'process == "CatAndCoven"' > artifacts/ios-cold-render-timeout-log.txt || true
            echo "::error::Cat & Coven stayed on the lightweight native launch frame instead of reaching the rendered Godot splash."
            tail -200 artifacts/ios-cold-render-timeout-log.txt || true
            exit 1
          fi
          WIDTH="$(sips -g pixelWidth artifacts/ios-01-cold-launch.png | awk '/pixelWidth:/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight artifacts/ios-01-cold-launch.png | awk '/pixelHeight:/ {print $2}')"
          echo "ios-01-cold-launch.png dimensions=${WIDTH}x${HEIGHT}" | tee -a artifacts/ios-frame-sizes.txt
          test "${WIDTH:-0}" -ge 640
          test "${HEIGHT:-0}" -ge 1100

      - name: Verify terminate and relaunch
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="com.akilta.catandcoven"
          DATA_PATH="$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" data)"
          test -d "$DATA_PATH"
          OLD_MARKER="$(find "$DATA_PATH" -type f -name native-runtime-review-route.txt -print -quit)"
          if [ -n "$OLD_MARKER" ]; then rm -f "$OLD_MARKER"; fi

          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID"
          sleep 2
          LAUNCH_OUTPUT="$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" --cat-coven-native-review-route=house 2>&1)"
          printf '%s\n' "$LAUNCH_OUTPUT" | tee artifacts/ios-house-relaunch.txt
          APP_PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' | tail -1)"
          test -n "$APP_PID"
          echo "IOS_RELAUNCH_PID=$APP_PID" | tee -a artifacts/ios-lifecycle.txt

          RENDERED=0
          for ATTEMPT in $(seq 1 18); do
            sleep 3
            xcrun simctl spawn "$SIM_UDID" launchctl list > artifacts/ios-relaunch-launchctl-list.txt 2>&1 || true
            grep -Fq "$BUNDLE_ID" artifacts/ios-relaunch-launchctl-list.txt

            MARKER_PATH="$(find "$DATA_PATH" -type f -name native-runtime-review-route.txt -print -quit)"
            ROUTE_STATE=""
            if [ -n "$MARKER_PATH" ]; then ROUTE_STATE="$(cat "$MARKER_PATH")"; fi

            xcrun simctl io "$SIM_UDID" screenshot artifacts/ios-02-house-relaunch.png
            test -s artifacts/ios-02-house-relaunch.png
            BYTES="$(stat -f%z artifacts/ios-02-house-relaunch.png)"
            echo "ios-02-house-relaunch.png attempt=$ATTEMPT bytes=$BYTES route=$ROUTE_STATE" | tee -a artifacts/ios-frame-sizes.txt

            if [ "$ROUTE_STATE" = "house" ] && [ "$BYTES" -ge 120000 ]; then
              RENDERED=1
              break
            fi
          done

          grep -F "$BUNDLE_ID" artifacts/ios-relaunch-launchctl-list.txt | tee artifacts/ios-process-relaunch-alive.txt
          if [ "$RENDERED" -ne 1 ]; then
            xcrun simctl spawn "$SIM_UDID" log show --last 3m --style compact --predicate 'process == "CatAndCoven"' > artifacts/ios-relaunch-render-timeout-log.txt || true
            echo "::error::Cat & Coven review relaunch did not reach the real House route."
            tail -200 artifacts/ios-relaunch-render-timeout-log.txt || true
            exit 1
          fi

          MARKER_PATH="$(find "$DATA_PATH" -type f -name native-runtime-review-route.txt -print -quit)"
          test -n "$MARKER_PATH"
          cp "$MARKER_PATH" artifacts/ios-native-review-route-house.txt
          grep -Fxq "house" artifacts/ios-native-review-route-house.txt

          WIDTH="$(sips -g pixelWidth artifacts/ios-02-house-relaunch.png | awk '/pixelWidth:/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight artifacts/ios-02-house-relaunch.png | awk '/pixelHeight:/ {print $2}')"
          echo "ios-02-house-relaunch.png dimensions=${WIDTH}x${HEIGHT}" | tee -a artifacts/ios-frame-sizes.txt
          test "${WIDTH:-0}" -ge 640
          test "${HEIGHT:-0}" -ge 1100

      - name: Capture native Play-entry journey on real product routes
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="com.akilta.catandcoven"
          DATA_PATH="$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" data)"
          test -d "$DATA_PATH"
          : > artifacts/ios-play-entry-frame-sizes.txt

          for SPEC in "map:03" "prestart:04" "gameplay:05"; do
            ROUTE="${SPEC%%:*}"
            INDEX="${SPEC##*:}"
            FRAME="artifacts/ios-${INDEX}-${ROUTE}.png"
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            OLD_MARKER="$(find "$DATA_PATH" -type f -name native-runtime-review-route.txt -print -quit)"
            if [ -n "$OLD_MARKER" ]; then rm -f "$OLD_MARKER"; fi

            LAUNCH_OUTPUT="$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" --cat-coven-native-review-route=$ROUTE 2>&1)"
            printf '%s\n' "$LAUNCH_OUTPUT" | tee "artifacts/ios-${ROUTE}-launch.txt"
            APP_PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' | tail -1)"
            test -n "$APP_PID"
            echo "IOS_NATIVE_ROUTE=${ROUTE} PID=${APP_PID}" | tee -a artifacts/ios-lifecycle.txt

            RENDERED=0
            for ATTEMPT in $(seq 1 12); do
              sleep 2
              xcrun simctl spawn "$SIM_UDID" launchctl list > "artifacts/ios-${ROUTE}-launchctl-list.txt" 2>&1 || true
              grep -Fq "$BUNDLE_ID" "artifacts/ios-${ROUTE}-launchctl-list.txt"
              xcrun simctl io "$SIM_UDID" screenshot "$FRAME"
              test -s "$FRAME"
              BYTES="$(stat -f%z "$FRAME")"
              MARKER_PATH="$(find "$DATA_PATH" -type f -name native-runtime-review-route.txt -print -quit)"
              ROUTE_STATE=""
              if [ -n "$MARKER_PATH" ]; then ROUTE_STATE="$(cat "$MARKER_PATH")"; fi
              echo "$(basename "$FRAME") attempt=$ATTEMPT bytes=$BYTES route=$ROUTE_STATE" | tee -a artifacts/ios-play-entry-frame-sizes.txt
              if [ "$BYTES" -ge 200000 ] && [ "$ROUTE_STATE" = "$ROUTE" ]; then
                RENDERED=1
                break
              fi
            done
            if [ "$RENDERED" -ne 1 ]; then
              xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact --predicate 'process == "CatAndCoven"' > "artifacts/ios-${ROUTE}-render-timeout-log.txt" || true
              echo "::error::Cat & Coven native review route did not reach rendered ${ROUTE} state."
              tail -200 "artifacts/ios-${ROUTE}-render-timeout-log.txt" || true
              exit 1
            fi

            WIDTH="$(sips -g pixelWidth "$FRAME" | awk '/pixelWidth:/ {print $2}')"
            HEIGHT="$(sips -g pixelHeight "$FRAME" | awk '/pixelHeight:/ {print $2}')"
            echo "$(basename "$FRAME") dimensions=${WIDTH}x${HEIGHT}" | tee -a artifacts/ios-play-entry-frame-sizes.txt
            test "${WIDTH:-0}" -ge 640
            test "${HEIGHT:-0}" -ge 1100
            MARKER_PATH="$(find "$DATA_PATH" -type f -name native-runtime-review-route.txt -print -quit)"
            test -n "$MARKER_PATH"
            cp "$MARKER_PATH" "artifacts/ios-native-review-route-${ROUTE}.txt"
            grep -Fxq "$ROUTE" "artifacts/ios-native-review-route-${ROUTE}.txt"
          done

          echo "IOS_NATIVE_PLAY_ENTRY_PASS: real House → Map → Prestart → Gameplay routes rendered"

      - name: Capture native secondary-screen journey on real product routes
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="com.akilta.catandcoven"
          DATA_PATH="$(xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" data)"
          test -d "$DATA_PATH"
          : > artifacts/ios-secondary-frame-sizes.txt
          : > artifacts/ios-secondary-route-attempts.txt

          # iOS Simulator can reclaim a long-running review process while several
          # large authored screens are swapped in sequence. Prove each destination
          # from a clean native launch instead; every route still traverses the real
          # Splash → House → destination product code before its marker is emitted.
          for SPEC in "reliquary:06" "events:07" "weekly:08" "shop:09" "profile:10" "settings:11"; do
            ROUTE="${SPEC%%:*}"
            INDEX="${SPEC##*:}"
            FRAME="artifacts/ios-${INDEX}-${ROUTE}.png"
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            OLD_MARKER="$(find "$DATA_PATH" -type f -name native-runtime-review-route.txt -print -quit)"
            if [ -n "$OLD_MARKER" ]; then rm -f "$OLD_MARKER"; fi

            LAUNCH_OUTPUT="$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" --cat-coven-native-review-route=$ROUTE 2>&1)"
            printf '%s\n' "$LAUNCH_OUTPUT" | tee "artifacts/ios-${ROUTE}-secondary-launch.txt"
            APP_PID="$(printf '%s\n' "$LAUNCH_OUTPUT" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' | tail -1)"
            test -n "$APP_PID"
            echo "IOS_NATIVE_SECONDARY route=$ROUTE pid=$APP_PID" | tee -a artifacts/ios-lifecycle.txt

            ROUTE_SEEN=0
            for ATTEMPT in $(seq 1 18); do
              sleep 2
              xcrun simctl spawn "$SIM_UDID" launchctl list > "artifacts/ios-${ROUTE}-secondary-launchctl-list.txt" 2>&1 || true
              PROCESS_ALIVE=0
              if grep -Fq "$BUNDLE_ID" "artifacts/ios-${ROUTE}-secondary-launchctl-list.txt"; then PROCESS_ALIVE=1; fi
              MARKER_PATH="$(find "$DATA_PATH" -type f -name native-runtime-review-route.txt -print -quit)"
              ROUTE_STATE=""
              if [ -n "$MARKER_PATH" ]; then ROUTE_STATE="$(cat "$MARKER_PATH")"; fi
              echo "route=$ROUTE attempt=$ATTEMPT observed=$ROUTE_STATE alive=$PROCESS_ALIVE" | tee -a artifacts/ios-secondary-route-attempts.txt
              if [ "$PROCESS_ALIVE" -eq 1 ] && [ "$ROUTE_STATE" = "$ROUTE" ]; then
                xcrun simctl io "$SIM_UDID" screenshot "$FRAME"
                test -s "$FRAME"
                BYTES="$(stat -f%z "$FRAME")"
                echo "$(basename "$FRAME") bytes=$BYTES route=$ROUTE_STATE" | tee -a artifacts/ios-secondary-frame-sizes.txt
                if [ "$BYTES" -ge 120000 ]; then
                  ROUTE_SEEN=1
                  WIDTH="$(sips -g pixelWidth "$FRAME" | awk '/pixelWidth:/ {print $2}')"
                  HEIGHT="$(sips -g pixelHeight "$FRAME" | awk '/pixelHeight:/ {print $2}')"
                  echo "$(basename "$FRAME") dimensions=${WIDTH}x${HEIGHT}" | tee -a artifacts/ios-secondary-frame-sizes.txt
                  test "${WIDTH:-0}" -ge 640
                  test "${HEIGHT:-0}" -ge 1100
                  cp "$MARKER_PATH" "artifacts/ios-native-review-route-${ROUTE}.txt"
                  grep -Fxq "$ROUTE" "artifacts/ios-native-review-route-${ROUTE}.txt"
                  break
                fi
              fi
            done
            if [ "$ROUTE_SEEN" -ne 1 ]; then
              xcrun simctl spawn "$SIM_UDID" log show --last 3m --style compact --predicate 'process == "CatAndCoven"' > "artifacts/ios-${ROUTE}-secondary-timeout-log.txt" || true
              echo "::error::Cat & Coven native secondary route did not reach rendered ${ROUTE}."
              tail -220 "artifacts/ios-${ROUTE}-secondary-timeout-log.txt" || true
              exit 1
            fi
          done

          echo "IOS_NATIVE_SECONDARY_PASS: real Reliquary / Events / Weekly / Shop / Profile / Settings routes rendered"
      - name: Check iOS runtime log for Cat & Coven failures
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl spawn "$SIM_UDID" log show --last 4m --style compact --predicate 'process == "CatAndCoven"' > artifacts/ios-runtime-log.txt || true
          if grep -Eq "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:|Terminating app due to uncaught exception|EXC_CRASH|SIGABRT" artifacts/ios-runtime-log.txt; then
            grep -E "Missing required production screen art|Failed to decode production screen art|Missing required gameplay asset|SCRIPT ERROR:|Terminating app due to uncaught exception|EXC_CRASH|SIGABRT" artifacts/ios-runtime-log.txt
            exit 1
          fi
          echo "IOS_SIMULATOR_RUNTIME_PASS: build, rendered Splash cold launch, terminate, post-splash House relaunch"

      # Exact native frame evidence is emitted on every runtime-verification checkpoint.
      - name: Emit compact native frames for visual inspection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for FRAME in ios-01-cold-launch ios-02-house-relaunch ios-03-map ios-04-prestart ios-05-gameplay ios-06-reliquary ios-07-events ios-08-weekly ios-09-shop ios-10-profile ios-11-settings; do
            SRC="artifacts/${FRAME}.png"
            [ -s "$SRC" ] || continue
            OUT="artifacts/${FRAME}-review.jpg"
            sips -Z 320 -s format jpeg -s formatOptions 40 "$SRC" --out "$OUT" >/dev/null
            echo "CAT_COVEN_NATIVE_FRAME_BEGIN:${FRAME}"
            base64 < "$OUT" | tr -d '\n'
            echo
            echo "CAT_COVEN_NATIVE_FRAME_END:${FRAME}"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-and-coven-ios-simulator-runtime-evidence
          path: |
            artifacts/
          if-no-files-found: error
