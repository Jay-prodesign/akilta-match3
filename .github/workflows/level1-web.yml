name: Level 1 iPhone Web Build

on:
  workflow_dispatch:
  push:
    branches: [p0/bootstrap]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'content/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/level1-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: '4.7.2'
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot editor and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d template_unpack
          cp -R template_unpack/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import assets and parse project
        run: |
          "$GODOT" --headless --path . --editor --quit
      - name: Export playable Web Level 1
        run: |
          mkdir -p build/web
          "$GODOT" --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
      - name: Upload Pages deployment artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/
      - name: Upload complete Web game
        uses: actions/upload-artifact@v4
        with:
          name: cat-and-coven-level1-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  # Deployment is optional: GitHub Pages must be enabled in repository settings.
  # A failed Pages setup must not mark a successful, downloadable Web export as failed.
  deploy:
    if: ${{ vars.ENABLE_LEVEL1_PAGES == 'true' }}
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Level 1 on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
