name: Materialize Cat & Coven piece pass

on:
  push:
    branches:
      - p0/bootstrap
    paths:
      - ".github/workflows/materialize-piece-pass.yml"
      - "assets/staging/cat_coven_piece_pass_v1_128.zip"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install production piece family
        shell: bash
        run: |
          set -euo pipefail
          unzip -o assets/staging/cat_coven_piece_pass_v1_128.zip -d assets/pieces
          test -s assets/pieces/moon_sigil.webp
          test -s assets/pieces/thorn_rose.webp
          test -s assets/pieces/luna_moth.webp
          test -s assets/pieces/curio_key.webp
          test -s assets/pieces/night_ivy.webp
          test -s assets/pieces/black_cat.webp
          test -s assets/pieces/candle.webp
          test -s assets/pieces/skull.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pieces/*.webp
          git rm -f assets/staging/cat_coven_piece_pass_v1_128.zip .github/workflows/materialize-piece-pass.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install production Cat & Coven piece family"
          git push origin HEAD:p0/bootstrap