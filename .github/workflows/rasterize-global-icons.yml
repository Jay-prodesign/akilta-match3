name: Rasterize Global UI Icon Family

on:
  push:
    branches:
      - feat/global-raster-icon-family
    paths:
      - ".github/workflows/rasterize-global-icons.yml"

permissions:
  contents: write

jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/global-raster-icon-family
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic rasterizer
        run: python -m pip install --disable-pip-version-check cairosvg==2.7.1 pillow==11.3.0
      - name: Build 128px production raster icon family
        shell: bash
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import cairosvg
          from PIL import Image, ImageChops, ImageEnhance, ImageFilter

          SOURCES = [
              "nav_house", "nav_curios", "nav_map", "nav_events",
              "nav_shop", "ui_coin", "ui_gem", "ui_profile",
          ]

          def shifted(mask, dx, dy):
              out = Image.new("L", mask.size, 0)
              out.paste(mask, (dx, dy))
              return out

          for name in SOURCES:
              svg_path = Path("assets/ui") / f"{name}.svg"
              png = cairosvg.svg2png(
                  bytestring=svg_path.read_bytes(),
                  output_width=512,
                  output_height=512,
              )
              source = Image.open(BytesIO(png)).convert("RGBA")
              source = ImageEnhance.Contrast(source).enhance(1.10)
              source = ImageEnhance.Sharpness(source).enhance(1.25)
              alpha = source.getchannel("A")

              glow_mask = alpha.filter(ImageFilter.GaussianBlur(15))
              shadow_mask = shifted(alpha.filter(ImageFilter.GaussianBlur(11)), 10, 14)
              top_edge = ImageChops.subtract(alpha, shifted(alpha, 5, 6)).filter(ImageFilter.GaussianBlur(1.2))
              low_edge = ImageChops.subtract(alpha, shifted(alpha, -5, -6)).filter(ImageFilter.GaussianBlur(1.2))

              canvas = Image.new("RGBA", source.size, (0, 0, 0, 0))
              plum_glow = Image.new("RGBA", source.size, (83, 42, 105, 0))
              plum_glow.putalpha(glow_mask.point(lambda p: int(p * 0.34)))
              canvas = Image.alpha_composite(canvas, plum_glow)

              shadow = Image.new("RGBA", source.size, (5, 2, 9, 0))
              shadow.putalpha(shadow_mask.point(lambda p: int(p * 0.62)))
              canvas = Image.alpha_composite(canvas, shadow)
              canvas = Image.alpha_composite(canvas, source)

              highlight = Image.new("RGBA", source.size, (255, 239, 186, 0))
              highlight.putalpha(top_edge.point(lambda p: int(p * 0.38)))
              canvas = Image.alpha_composite(canvas, highlight)

              shade = Image.new("RGBA", source.size, (55, 24, 73, 0))
              shade.putalpha(low_edge.point(lambda p: int(p * 0.34)))
              canvas = Image.alpha_composite(canvas, shade)

              final = canvas.resize((128, 128), Image.Resampling.LANCZOS)
              final.save(Path("assets/ui") / f"{name}.webp", "WEBP", quality=92, method=6, lossless=False)
          PY
      - name: Commit generated raster family
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/nav_house.webp assets/ui/nav_curios.webp assets/ui/nav_map.webp assets/ui/nav_events.webp assets/ui/nav_shop.webp assets/ui/ui_coin.webp assets/ui/ui_gem.webp assets/ui/ui_profile.webp
          if git diff --cached --quiet; then
            echo "Raster family already current."
            exit 0
          fi
          git commit -m "Generate global raster icon family"
          git push origin HEAD:feat/global-raster-icon-family
