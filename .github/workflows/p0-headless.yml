      - "tests/unit/test_weekly_missions_screen.gd"
      - "tests/unit/test_reliquary_production_screen.gd"
      - "tests/unit/test_house_authored_state_family.gd"
      - "tests/unit/test_gameplay_authored_presentation_shell.gd"
      - "tests/unit/test_prestart_authored_production_screen.gd"
      - "tests/unit/test_chapter_route_authored_screen.gd"
      - "tests/unit/test_settings_authored_utility_screen.gd"
      - "tests/unit/test_meta_destination_screen.gd"
      - "assets/manifests/screen_contracts.json"
      - "assets/manifests/screen_asset_manifest.json"
      - "tests/unit/test_screen_state_architecture.gd"
      - "tests/unit/test_specials_objectives.gd"
      - "tests/unit/test_save_progress.gd"
      - "tests/unit/test_product_analytics.gd"
      - "tests/unit/test_first_party_shell.gd"
      - "tests/integration/test_first_player_journey.gd"
      - "tests/integration/test_save_recovery_surface.gd"
      - "tests/integration/test_analytics_journey.gd"
      - "tests/integration/test_splash_boot_states.gd"
      - "tests/integration/test_chapter_select_states.gd"
      - "tests/integration/test_chapter_route_frontier.gd"
      - "tests/integration/test_restoration_presentation.gd"
      - "tests/integration/test_level1_gameplay.gd"
      - "tests/integration/test_level1_failure_recovery.gd"
      - "tests/integration/test_golden_feedback_vfx.gd"
      - "tests/integration/test_gameplay_feel.gd"
      - "tests/integration/test_gameplay_impact_hierarchy.gd"
      - "tests/integration/test_gameplay_objective_terminal_feedback.gd"
      - "tests/integration/test_opening_two_level_journey.gd"
      - "tests/integration/test_returning_player_resume.gd"
  # Milestone trigger: canonical Golden Loop architecture + playable journey verification (2026-10-11).
  # Run the full milestone checks deliberately, not on every development commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip             "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Run bootstrap contract
        shell: bash
        run: |
          timeout 30s ./godot --headless --path . -s res://tests/unit/test_bootstrap.gd

      - name: Run S00 boot state contract
        shell: bash
        run: |
          set +e
          output=$(timeout 35s ./godot --headless --path . -s res://tests/integration/test_splash_boot_states.gd 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:|TEST_FAIL:" <<<"$output"; then exit 1; fi
          grep -Fq "TEST_PASS: S00 boot loading ready and recovery contract" <<<"$output"

      - name: Run native mobile configuration contracts
        shell: bash
        run: |
          timeout 30s ./godot --headless --path . -s res://tests/unit/test_mobile_release_contract.gd
          timeout 30s ./godot --headless --path . -s res://tests/unit/test_mobile_safe_area.gd

      - name: Run canonical screen-state architecture contract
        shell: bash
        run: |
          timeout 30s ./godot --headless --path . -s res://tests/unit/test_screen_state_architecture.gd

      - name: Run deterministic Match-3 core contract
        shell: bash
        run: |
          set -euo pipefail
          output=$(timeout 30s ./godot --headless --path . -s res://tests/unit/test_match3_core.gd 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::Deterministic core contract exited with $status."
            exit "$status"
          fi
          if grep -Eq "SCRIPT ERROR:|(^| )ERROR:" <<<"$output"; then
            echo "::error::Godot reported script/runtime errors during deterministic core contract."
            exit 1
          fi
          if ! grep -Fq "TEST_PASS: deterministic Match-3 core" <<<"$output"; then
            echo "::error::Deterministic core contract did not emit its PASS marker."
            exit 1
          fi

      - name: Run specials blockers and objectives contract
        shell: bash
        run: |
          set -uo pipefail
          set +e
