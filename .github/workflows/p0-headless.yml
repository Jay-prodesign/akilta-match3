  push:
    branches:
      - main
      - p0/bootstrap
      - "p1/**"
      - "feat/**"
    paths:
      - ".github/workflows/p0-headless.yml"
      - ".github/release-proof.trigger"
      - ".github/workflows/mobile-release.yml"
      - "project.godot"
      - "export_presets.cfg"
      - "assets/mobile/**"
      - "tests/unit/test_mobile_release_contract.gd"
      - "tests/unit/test_mobile_safe_area.gd"
      - "src/app/**"
      - "src/analytics/**"
      - "src/ui/home/**"
